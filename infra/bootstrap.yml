AWSTemplateFormatVersion: '2010-09-09'
Description: One-time certificate, edge settings, origin secret, artifact bucket and IAM roles for wildduck-spam-trainer production

Parameters:
  PublicDomainName:
    Type: String
    Default: wildduck-spam-training.rungie.com
    AllowedValues: [wildduck-spam-training.rungie.com]
    Description: Approved stable public webhook hostname
  HostedZoneId:
    Type: String
    Default: Z1VXUCOF8PCGCR
    AllowedValues: [Z1VXUCOF8PCGCR]
    Description: Existing rungie.com hosted zone
  GitHubRepositoryId:
    Type: String
    Description: Immutable numeric ID of hughescr/wildduck-spam-trainer (gh api repos/hughescr/wildduck-spam-trainer --jq .id)
    AllowedPattern: '^[1-9][0-9]{0,15}$'
  AllowedSourceIps:
    Type: String
    Default: 54.71.178.94,2600:1f14:e8d:b300:9114:71e8:b97:39c
    Description: Comma-separated exact IPv4/IPv6 viewer addresses allowed to reach every path except /healthz and /readyz (no spaces, no CIDR)
    # Hex digits, dots and colons only: the value is substituted into the edge function source.
    AllowedPattern: '^[0-9A-Fa-f.:]{2,45}(,[0-9A-Fa-f.:]{2,45}){0,49}$'
    MaxLength: 2000
  OriginSecretRotationSerial:
    Type: String
    Default: '1'
    Description: Increment after putting a new origin secret value, then deploy the service to re-resolve its origin header
    AllowedPattern: '^[0-9]{1,9}$'

Resources:
  # Shared custom-resource contract; its implementation does not document Tags support.
  SSLCertificate:
    Type: Custom::DNSCertificate
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DomainName:
        Ref: PublicDomainName
      ValidationMethod: DNS
      Region: us-east-1
      DomainValidationOptions:
        - DomainName:
            Ref: PublicDomainName
          HostedZoneId:
            Ref: HostedZoneId
      ServiceToken:
        Fn::ImportValue: CertificateAccepterLambda-Arn
  # CloudFront sends this as X-Origin-Verify; the Lambda rejects every request without it.
  # The value is generated here and never appears in this template or any output.
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: wildduck-spam-trainer/prod/origin-verify-key
      Description: CloudFront-to-Lambda origin verification header value for wildduck-spam-trainer
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        IncludeSpace: false
        RequireEachIncludedType: true
      Tags:
        - Key: Project
          Value: Email
        - Key: Service
          Value: wildduck-spam-trainer
  AllowedSourceIpsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /wildduck-spam-trainer/prod/allowed-source-ips
      Type: String
      Value:
        Ref: AllowedSourceIps
      # Also validates subsequent admin PutParameter updates, not just bootstrap inputs.
      AllowedPattern: '^[0-9A-Fa-f.:]{2,45}(,[0-9A-Fa-f.:]{2,45}){0,49}$'
      Tags:
        Project: Email
        Service: wildduck-spam-trainer
  OriginSecretRotationSerialParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /wildduck-spam-trainer/prod/origin-secret-rotation-serial
      Type: String
      Value:
        Ref: OriginSecretRotationSerial
      AllowedPattern: '^[0-9]{1,9}$'
      Tags:
        Project: Email
        Service: wildduck-spam-trainer
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: OldArtifactVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: Email
        - Key: Service
          Value: wildduck-spam-trainer
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: wildduck-spam-trainer-prod-execution
      Tags:
        - Key: Project
          Value: Email
        - Key: Service
          Value: wildduck-spam-trainer
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/wildduck-spam-trainer-prod-webhook:*
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/wildduck-spam-trainer/prod/training-proxy-key
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Ref: OriginVerifySecret
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: wildduck-spam-trainer-github-deploy
      MaxSessionDuration: 3600
      Tags:
        - Key: Project
          Value: Email
        - Key: Service
          Value: wildduck-spam-trainer
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Fn::ImportValue: GitHubOIDCProvider-Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # New repositories use immutable owner/repository IDs in the subject.
                # Verify with: gh api repos/hughescr/wildduck-spam-trainer/actions/oidc/customization/sub
                token.actions.githubusercontent.com:sub:
                  Fn::Sub: repo:hughescr@46348/wildduck-spam-trainer@${GitHubRepositoryId}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Serverless uses direct CreateStack/UpdateStack, not change sets or a service role.
              # Deny alternate resource-management paths even if another policy later allows them.
              - Sid: DenyAlternateResourceManagement
                Effect: Deny
                Action: [cloudformation:CreateChangeSet, cloudformation:ExecuteChangeSet, cloudformation:CreateResource, cloudformation:UpdateResource, cloudformation:DeleteResource, cloudformation:CreateStackRefactor, cloudformation:ExecuteStackRefactor, cloudformation:ImportStacksToStackSet]
                Resource: '*'
              - Sid: ServiceStack
                Effect: Allow
                Action: [cloudformation:CreateStack, cloudformation:UpdateStack, cloudformation:DescribeStacks, cloudformation:DescribeStackEvents, cloudformation:DescribeStackResource, cloudformation:DescribeStackResources, cloudformation:GetTemplate, cloudformation:GetTemplateSummary, cloudformation:ListStackResources, cloudformation:CancelUpdateStack, cloudformation:ContinueUpdateRollback]
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/wildduck-spam-trainer-prod/*
              - Sid: ServiceStackTags
                Effect: Allow
                Action: [cloudformation:TagResource, cloudformation:UntagResource]
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/wildduck-spam-trainer-prod/*
                Condition:
                  ForAllValues:StringEquals:
                    aws:TagKeys: [Project, Service]
                  'Null':
                    aws:TagKeys: 'false'
              - Sid: ValidateTemplate
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: ArtifactBucketRead
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation, s3:GetBucketVersioning, s3:GetEncryptionConfiguration, s3:GetBucketPublicAccessBlock]
                Resource:
                  Fn::GetAtt: [ArtifactBucket, Arn]
              - Sid: ServiceArtifacts
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  Fn::Sub: ${ArtifactBucket.Arn}/serverless/wildduck-spam-trainer/prod/*
              - Sid: ServiceLambda
                Effect: Allow
                Action: ['lambda:*']
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:wildduck-spam-trainer-prod-webhook
                  - Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:wildduck-spam-trainer-prod-webhook:*
              - Sid: ExecutionRoleOnly
                Effect: Allow
                Action: [iam:GetRole, iam:PassRole]
                Resource:
                  Fn::GetAtt: [ExecutionRole, Arn]
                Condition:
                  StringEqualsIfExists:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: LocateLogGroup
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              - Sid: ReadProviderListsViaCloudFormation
                Effect: Allow
                Action: [cloudfront:ListDistributions, cloudfront:ListFunctions, logs:DescribeIndexPolicies, logs:DescribeResourcePolicies]
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:CalledViaLast: cloudformation.amazonaws.com
              - Sid: ReadDistributionDependenciesViaCloudFormation
                Effect: Allow
                Action: [cloudfront:GetConnectionGroup, cloudfront:GetVpcOrigin]
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:connection-group/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:vpcorigin/*
                Condition:
                  StringEquals:
                    aws:CalledViaLast: cloudformation.amazonaws.com
              - Sid: ServiceLogs
                Effect: Allow
                Action: ['logs:*']
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/wildduck-spam-trainer-prod-webhook
                  - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/wildduck-spam-trainer-prod-webhook:*
              - Sid: ReadEdgeSettings
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/wildduck-spam-trainer/prod/allowed-source-ips
                  - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/wildduck-spam-trainer/prod/origin-secret-rotation-serial
              - Sid: ResolveOriginSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Ref: OriginVerifySecret
              # SAR: CreateDistributionWithTags is an API, authorized by CreateDistribution + TagResource.
              # Create actions have no resource-level support, but support request-tag conditions.
              - Sid: CreateTaggedEdge
                Effect: Allow
                Action: [cloudfront:CreateDistribution, cloudfront:CreateFunction]
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: Email
                    aws:RequestTag/Service: wildduck-spam-trainer
              # Tag-on-create cannot require a pre-existing resource tag. Confine this grant to
              # CloudFormation's forwarded identity; without imports it cannot adopt existing resources.
              # Never allow request-tag-only TagResource directly: that permits tag-based takeover.
              - Sid: TagNewEdgeViaCloudFormation
                Effect: Allow
                Action: cloudfront:TagResource
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
                  - Fn::Sub: arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:function/wildduck-spam-trainer-prod-viewer-request
                Condition:
                  StringEquals:
                    aws:CalledViaLast: cloudformation.amazonaws.com
                    aws:RequestTag/Project: Email
                    aws:RequestTag/Service: wildduck-spam-trainer
              - Sid: ManageServiceDistribution
                Effect: Allow
                Action: [cloudfront:GetDistribution, cloudfront:GetDistributionConfig, cloudfront:UpdateDistribution, cloudfront:DeleteDistribution, cloudfront:ListTagsForResource, cloudfront:TagResource, cloudfront:UntagResource]
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Service: wildduck-spam-trainer
              - Sid: ManageViewerFunction
                Effect: Allow
                Action: [cloudfront:DescribeFunction, cloudfront:GetFunction, cloudfront:TestFunction, cloudfront:UpdateFunction, cloudfront:PublishFunction, cloudfront:DeleteFunction, cloudfront:ListTagsForResource, cloudfront:TagResource, cloudfront:UntagResource]
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:function/wildduck-spam-trainer-prod-viewer-request
              - Sid: PublicDnsOnly
                Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}
                Condition:
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames:
                      - Ref: PublicDomainName
                    route53:ChangeResourceRecordSetsRecordTypes: [A, AAAA]
                    route53:ChangeResourceRecordSetsActions: [CREATE, UPSERT, DELETE]
                  'Null':
                    route53:ChangeResourceRecordSetsNormalizedRecordNames: 'false'
                    route53:ChangeResourceRecordSetsRecordTypes: 'false'
                    route53:ChangeResourceRecordSetsActions: 'false'
              - Sid: ListHostedZones
                Effect: Allow
                Action: route53:ListHostedZones
                Resource: '*'
              - Sid: ReadPublicZone
                Effect: Allow
                Action: [route53:GetHostedZone, route53:ListResourceRecordSets]
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}
              - Sid: PollDnsChanges
                Effect: Allow
                Action: route53:GetChange
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:route53:::change/*

Outputs:
  CertificateArn:
    Value:
      Ref: SSLCertificate
    Export:
      Name: wildduck-spam-trainer-prod-CertificateArn
  HostedZoneId:
    Value:
      Ref: HostedZoneId
    Export:
      Name: wildduck-spam-trainer-prod-HostedZoneId
  PublicDomainName:
    Value:
      Ref: PublicDomainName
    Export:
      Name: wildduck-spam-trainer-prod-PublicDomainName
  OriginVerifySecretArn:
    Value:
      Ref: OriginVerifySecret
  ArtifactBucketName:
    Value:
      Ref: ArtifactBucket
  ExecutionRoleArn:
    Value:
      Fn::GetAtt: [ExecutionRole, Arn]
  GitHubDeployRoleArn:
    Value:
      Fn::GetAtt: [GitHubDeployRole, Arn]
