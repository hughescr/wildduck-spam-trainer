service: wildduck-spam-trainer
frameworkVersion: '4'
configValidationMode: error

provider:
  name: aws
  runtime: nodejs26.x
  architecture: arm64
  region: us-west-2
  stage: prod
  # Direct deploy prevents resource imports; the deploy role intentionally cannot create change sets.
  deploymentMethod: direct
  # 1024 MB is an intentional floor (CPU share for streaming); never lower it.
  memorySize: 1024
  timeout: 25
  versionFunctions: true
  logRetentionInDays: 14
  deploymentBucket:
    name: ${env:AWS_DEPLOYMENT_BUCKET_NAME, 'wildduck-spam-trainer-artifacts-unconfigured'}
    blockPublicAccess: true
  iam:
    role: ${env:AWS_EXECUTION_ROLE_ARN, 'arn:aws:iam::000000000000:role/wildduck-spam-trainer-prod-execution'}
  # Names only, never values. Unset names leave the service fail-closed (503).
  environment:
    TRAINING_PROXY_KEY_PARAMETER: ${env:TRAINING_PROXY_KEY_PARAMETER, ''}
    ORIGIN_VERIFY_SECRET_ID: ${env:ORIGIN_VERIFY_SECRET_ID, ''}
  stackTags:
    Project: Email
    Service: wildduck-spam-trainer
  tags:
    Project: Email
    Service: wildduck-spam-trainer

# Build once in the unprivileged CI job; deploy that exact artifact.
build:
  esbuild: false
package:
  artifact: dist/function.zip

functions:
  webhook:
    handler: handler.handler
    description: wildduck-spam-trainer ${file(./package.json):version}
    # Public Function URL (AuthType NONE) behind CloudFront; the origin header is the only inbound authentication.
    url: true
    # Bounds the cost of abusive direct traffic; WildDuck posts one delivery at a time.
    reservedConcurrency: 5

resources:
  # Serverless emits this log group without explicit tags; do not rely on stack-tag propagation.
  extensions:
    WebhookLogGroup:
      Properties:
        Tags:
          - Key: Project
            Value: Email
          - Key: Service
            Value: wildduck-spam-trainer
  Resources:
    ViewerRequestFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: wildduck-spam-trainer-prod-viewer-request
        AutoPublish: true
        FunctionConfig:
          Comment: Source-IP allowlist for every path except exact /healthz and /readyz; drops viewer x-origin-verify
          Runtime: cloudfront-js-2.0
        Tags:
          - Key: Project
            Value: Email
          - Key: Service
            Value: wildduck-spam-trainer
        # deploy.sh pins validated SSM values; the raw SSM fallback supports packaging only.
        FunctionCode: |
          var ALLOWED_SOURCE_IPS = '${env:ALLOWED_SOURCE_IPS, ssm(raw):/wildduck-spam-trainer/prod/allowed-source-ips}';

          function normalizeV4(text) {
            var parts = text.split('.');
            if (parts.length !== 4) { return null; }
            var out = [];
            for (var i = 0; i < 4; i++) {
              if (!/^[0-9]{1,3}$/.test(parts[i])) { return null; }
              var octet = parseInt(parts[i], 10);
              if (octet > 255) { return null; }
              out.push(String(octet));
            }
            return out.join('.');
          }

          function groupsOf(part) {
            return part === '' ? [] : part.split(':');
          }

          function normalizeV6(text) {
            var value = text.toLowerCase();
            var tail = [];
            if (value.indexOf('.') !== -1) {
              var lastColon = value.lastIndexOf(':');
              var v4 = normalizeV4(value.slice(lastColon + 1));
              if (v4 === null) { return null; }
              var o = v4.split('.');
              tail = [(parseInt(o[0], 10) * 256 + parseInt(o[1], 10)).toString(16), (parseInt(o[2], 10) * 256 + parseInt(o[3], 10)).toString(16)];
              value = value.slice(0, lastColon + 1);
              if (value.slice(-2) !== '::') { value = value.slice(0, -1); }
            }
            var halves = value.split('::');
            if (halves.length > 2) { return null; }
            var head = groupsOf(halves[0]);
            var rest = halves.length === 2 ? groupsOf(halves[1]) : [];
            var count = head.length + rest.length + tail.length;
            var groups;
            if (halves.length === 2) {
              if (count > 7) { return null; }
              var fill = [];
              for (var z = 0; z < 8 - count; z++) { fill.push('0'); }
              groups = head.concat(fill, rest, tail);
            } else {
              if (count !== 8) { return null; }
              groups = head.concat(tail);
            }
            for (var g = 0; g < 8; g++) {
              if (!/^[0-9a-f]{1,4}$/.test(groups[g])) { return null; }
              groups[g] = parseInt(groups[g], 16).toString(16);
            }
            if (groups.slice(0, 5).join(':') === '0:0:0:0:0' && groups[5] === 'ffff') {
              var high = parseInt(groups[6], 16);
              var low = parseInt(groups[7], 16);
              return [high >> 8, high & 255, low >> 8, low & 255].join('.');
            }
            return groups.join(':');
          }

          function normalizeIp(text) {
            if (typeof text !== 'string' || text.length < 2 || text.length > 45) { return null; }
            return text.indexOf(':') === -1 ? normalizeV4(text) : normalizeV6(text);
          }

          var ALLOWED = [];
          var entries = ALLOWED_SOURCE_IPS.split(',');
          for (var e = 0; e < entries.length; e++) {
            var normalized = normalizeIp(entries[e]);
            if (normalized !== null) { ALLOWED.push(normalized); }
          }

          function handler(event) {
            var request = event.request;
            // Belt and braces: CloudFront's origin custom header already overrides it.
            if (request.headers) { delete request.headers['x-origin-verify']; }
            // Exact matches only; every other path, however spelled, needs an allowed viewer.
            if (request.uri === '/healthz' || request.uri === '/readyz') { return request; }
            // event.viewer.ip is CloudFront's connection address; X-Forwarded-For is never read.
            var viewer = normalizeIp(event.viewer ? event.viewer.ip : null);
            if (viewer !== null && ALLOWED.indexOf(viewer) !== -1) { return request; }
            return { statusCode: 403, statusDescription: 'Forbidden', headers: { 'cache-control': { value: 'no-store' } } };
          }
    PublicDistribution:
      Type: AWS::CloudFront::Distribution
      DeletionPolicy: RetainExceptOnCreate
      UpdateReplacePolicy: Retain
      Properties:
        DistributionConfig:
          Aliases:
            - Fn::ImportValue: wildduck-spam-trainer-prod-PublicDomainName
          # Deploy-time SSM resolution changes this literal, forcing a distribution update
          # and re-resolution of the origin secret when the admin bumps the serial.
          Comment: wildduck-spam-trainer webhook edge (origin secret serial ${env:ORIGIN_SECRET_ROTATION_SERIAL, ssm(raw):/wildduck-spam-trainer/prod/origin-secret-rotation-serial})
          Enabled: true
          IPV6Enabled: true
          HttpVersion: http2and3
          PriceClass: PriceClass_100
          ViewerCertificate:
            AcmCertificateArn:
              Fn::ImportValue: wildduck-spam-trainer-prod-CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          Origins:
            - Id: lambda-function-url
              DomainName:
                # Verified against installed Serverless v4 naming/compileFunctions source.
                Fn::Select: [2, {Fn::Split: ['/', {Fn::GetAtt: [WebhookLambdaFunctionUrl, FunctionUrl]}]}]
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginReadTimeout: 30
                OriginSSLProtocols: [TLSv1.2]
              # Origin custom headers override any same-named viewer header.
              OriginCustomHeaders:
                - HeaderName: X-Origin-Verify
                  HeaderValue: '{{resolve:secretsmanager:${env:ORIGIN_VERIFY_SECRET_ID}:SecretString}}'
          DefaultCacheBehavior:
            TargetOriginId: lambda-function-url
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            # AWS managed CachingDisabled policy.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN:
                  Fn::GetAtt: [ViewerRequestFunction, FunctionARN]
          # Supported errors keep their actual status/body, with no edge error-cache lifetime.
          CustomErrorResponses:
            - {ErrorCode: 400, ErrorCachingMinTTL: 0}
            - {ErrorCode: 403, ErrorCachingMinTTL: 0}
            - {ErrorCode: 404, ErrorCachingMinTTL: 0}
            - {ErrorCode: 405, ErrorCachingMinTTL: 0}
            - {ErrorCode: 414, ErrorCachingMinTTL: 0}
            - {ErrorCode: 416, ErrorCachingMinTTL: 0}
            - {ErrorCode: 500, ErrorCachingMinTTL: 0}
            - {ErrorCode: 501, ErrorCachingMinTTL: 0}
            - {ErrorCode: 502, ErrorCachingMinTTL: 0}
            - {ErrorCode: 503, ErrorCachingMinTTL: 0}
            - {ErrorCode: 504, ErrorCachingMinTTL: 0}
        Tags:
          - Key: Project
            Value: Email
          - Key: Service
            Value: wildduck-spam-trainer
    PublicDnsA:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId:
          Fn::ImportValue: wildduck-spam-trainer-prod-HostedZoneId
        Name:
          Fn::ImportValue: wildduck-spam-trainer-prod-PublicDomainName
        Type: A
        AliasTarget:
          DNSName:
            Fn::GetAtt: [PublicDistribution, DomainName]
          HostedZoneId: Z2FDTNDATAQYW2
    PublicDnsAAAA:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId:
          Fn::ImportValue: wildduck-spam-trainer-prod-HostedZoneId
        Name:
          Fn::ImportValue: wildduck-spam-trainer-prod-PublicDomainName
        Type: AAAA
        AliasTarget:
          DNSName:
            Fn::GetAtt: [PublicDistribution, DomainName]
          HostedZoneId: Z2FDTNDATAQYW2
  Outputs:
    PublicWebhookUrl:
      Value:
        Fn::Join: ['', ['https://', {Fn::ImportValue: wildduck-spam-trainer-prod-PublicDomainName}, '/hooks/wildduck']]
    DistributionId:
      Value:
        Ref: PublicDistribution
    DistributionDomainName:
      Value:
        Fn::GetAtt: [PublicDistribution, DomainName]
